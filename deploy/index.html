<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>Chamados TI Buritis</title>
    <meta
      name="description"
      content="Sistema corporativo de helpdesk para abertura e gestão de chamados de informática."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chamados TI" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%);
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 24px;
        padding: 40px 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      h1 {
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 12px;
      }
      p {
        font-size: 0.95rem;
        opacity: 0.9;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .spinner {
        width: 44px;
        height: 44px;
        margin: 0 auto 24px;
        border: 4px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      a.btn {
        display: inline-block;
        background: #fff;
        color: #1e3a8a;
        font-weight: 600;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 12px;
        transition: opacity 0.2s;
      }
      a.btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Chamados TI Buritis</h1>
      <p>Carregando o sistema de chamados. Se nada acontecer, clique no botão abaixo.</p>
      <a class="btn" href="/dashboard">Abrir o sistema</a>
    </div>
    <script>
      // O app real é renderizado pelo servidor Node (SSR). Esta página é apenas
      // um fallback estático. Redireciona para a aplicação quando servida.
      setTimeout(function () {
        window.location.replace("/dashboard");
      }, 1200);
    </script>
  </body>
</html>
