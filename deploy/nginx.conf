# Nginx como reverse proxy para o app (SSR Node rodando em 127.0.0.1:3000)
# Copie para /etc/nginx/sites-available/chamados e crie o symlink em sites-enabled.

server {
    listen 80;
    server_name seu-dominio.com.br www.seu-dominio.com.br;

    # Redireciona tudo para HTTPS (ative após configurar o certificado)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

